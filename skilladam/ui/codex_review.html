<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillAdam Patch Review</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--color-background-primary, light-dark(#ffffff, #161616));
      --surface: var(--color-background-secondary, light-dark(#f6f7f8, #202124));
      --surface-strong: var(--color-background-tertiary, light-dark(#eceef0, #292b2e));
      --text: var(--color-text-primary, light-dark(#181a1d, #f5f6f7));
      --muted: var(--color-text-secondary, light-dark(#62676f, #aeb3ba));
      --border: var(--color-border-primary, light-dark(#d7dade, #3a3d42));
      --accent: var(--color-accent, light-dark(#1668c7, #62a8f5));
      --accept: light-dark(#14753d, #58c987);
      --accept-bg: light-dark(#e9f7ef, #153c28);
      --reject: light-dark(#b4232f, #ff7b84);
      --reject-bg: light-dark(#fff0f1, #462126);
      --added-bg: light-dark(#e8f6ed, #173a28);
      --removed-bg: light-dark(#fdecee, #452126);
      --code-bg: light-dark(#f8f9fa, #111214);
      --shadow: 0 1px 2px light-dark(rgb(0 0 0 / 8%), rgb(0 0 0 / 35%));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif);
      letter-spacing: 0;
    }

    body { padding: 14px; }

    button {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      cursor: pointer;
    }

    button:hover:not(:disabled) { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .55; }

    .shell {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 700;
    }

    .summary {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .counts {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
      min-height: 26px;
    }

    .count {
      min-width: 64px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
    }

    .bulk-actions, .submit-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bulk-actions button { padding: 0 11px; }

    .submit {
      min-width: 112px;
      padding: 0 14px;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .status {
      min-height: 20px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status[data-tone="error"] { color: var(--reject); }
    .status[data-tone="success"] { color: var(--accept); }

    .hunks {
      display: grid;
      gap: 10px;
    }

    .hunk {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hunk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 8px 10px 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .hunk-title { min-width: 0; }

    .hunk-name {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .hunk-id {
      margin-top: 2px;
      color: var(--muted);
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace);
      font-size: 10px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .decision {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 0 0 150px;
      min-width: 150px;
      height: 34px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }

    .decision button {
      min-height: 32px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }

    .decision button + button { border-left: 1px solid var(--border); }
    .decision .accept[aria-pressed="true"] { background: var(--accept-bg); color: var(--accept); }
    .decision .reject[aria-pressed="true"] { background: var(--reject-bg); color: var(--reject); }

    .diff {
      margin: 0;
      max-height: 320px;
      overflow: auto;
      background: var(--code-bg);
      color: var(--text);
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace);
      font-size: 11px;
      line-height: 1.55;
      tab-size: 2;
    }

    .diff-line {
      display: block;
      width: max-content;
      min-width: 100%;
      min-height: 17px;
      padding: 0 12px;
      white-space: pre;
    }

    .diff-line.added { background: var(--added-bg); }
    .diff-line.removed { background: var(--removed-bg); }
    .diff-line.header { color: var(--muted); background: var(--surface-strong); }

    .loading, .empty {
      padding: 38px 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 620px) {
      body { padding: 10px; }
      .header, .toolbar, .hunk-header { align-items: stretch; flex-direction: column; }
      .counts { align-self: stretch; }
      .count { flex: 1 1 0; }
      .bulk-actions, .submit-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .submit-actions .submit { grid-column: 1 / -1; }
      .decision { width: 100%; min-width: 0; flex-basis: auto; }
      .diff { max-height: 260px; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <section id="loading" class="loading">Loading proposed changes...</section>
    <section id="review" hidden>
      <header class="header">
        <div>
          <h1>Choose changes to apply</h1>
          <p id="summary" class="summary"></p>
        </div>
        <div class="counts" aria-label="Selection counts">
          <span id="accepted-count" class="count"></span>
          <span id="rejected-count" class="count"></span>
        </div>
      </header>

      <div class="toolbar">
        <div class="bulk-actions">
          <button id="accept-all" type="button">Accept all</button>
          <button id="reject-all" type="button">Reject all</button>
        </div>
        <div class="submit-actions">
          <button id="submit" class="submit" type="button">Submit choices</button>
        </div>
      </div>

      <p id="status" class="status"></p>
      <div id="hunks" class="hunks"></div>
    </section>
  </main>

  <script>
    (() => {
      const APP_INFO = { name: "SkillAdam Patch Review", version: "1.0.0" };
      const PROTOCOL_VERSION = "2026-01-26";
      const pending = new Map();
      const decisions = new Map();
      let nextRequestId = 1;
      let reviewData = null;
      let submitted = false;
      let initialized = false;
      let refreshPromise = null;

      const loadingEl = document.getElementById("loading");
      const reviewEl = document.getElementById("review");
      const summaryEl = document.getElementById("summary");
      const statusEl = document.getElementById("status");
      const hunksEl = document.getElementById("hunks");
      const acceptedCountEl = document.getElementById("accepted-count");
      const rejectedCountEl = document.getElementById("rejected-count");
      const acceptAllButton = document.getElementById("accept-all");
      const rejectAllButton = document.getElementById("reject-all");
      const submitButton = document.getElementById("submit");

      function post(message) {
        window.parent.postMessage(message, "*");
      }

      function request(method, params, timeoutMs = 20000) {
        const id = nextRequestId++;
        post({ jsonrpc: "2.0", id, method, params });
        return new Promise((resolve, reject) => {
          const timer = window.setTimeout(() => {
            pending.delete(id);
            reject(new Error(`${method} request timed out`));
          }, timeoutMs);
          pending.set(id, { resolve, reject, timer });
        });
      }

      async function callTool(name, args, timeoutMs = 20000) {
        try {
          return await request("tools/call", { name, arguments: args }, timeoutMs);
        } catch (error) {
          if (typeof window.openai?.callTool === "function") {
            return window.openai.callTool(name, args);
          }
          throw error;
        }
      }

      function notify(method, params = {}) {
        post({ jsonrpc: "2.0", method, params });
      }

      function setStatus(message, tone = "neutral") {
        statusEl.textContent = message;
        statusEl.dataset.tone = tone;
      }

      function applyHostContext(context) {
        const variables = context?.styles?.variables;
        if (variables && typeof variables === "object") {
          for (const [name, value] of Object.entries(variables)) {
            if (name.startsWith("--") && typeof value === "string") {
              document.documentElement.style.setProperty(name, value);
            }
          }
        }
        if (context?.theme === "dark" || context?.theme === "light") {
          document.documentElement.style.colorScheme = context.theme;
        }
      }

      function renderDiff(target, diff) {
        for (const line of String(diff || "").split("\n")) {
          const row = document.createElement("span");
          row.className = "diff-line";
          if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("@@")) {
            row.classList.add("header");
          } else if (line.startsWith("+")) {
            row.classList.add("added");
          } else if (line.startsWith("-")) {
            row.classList.add("removed");
          }
          row.textContent = line || " ";
          target.appendChild(row);
        }
      }

      function updateCounts() {
        const hunks = reviewData?.hunks || [];
        const accepted = hunks.filter((hunk) => decisions.get(hunk.hunk_id) === "accept").length;
        acceptedCountEl.textContent = `Accepted ${accepted}`;
        rejectedCountEl.textContent = `Rejected ${hunks.length - accepted}`;
      }

      function updateDecisionButtons(container, decision) {
        for (const button of container.querySelectorAll("button[data-decision]")) {
          button.setAttribute("aria-pressed", String(button.dataset.decision === decision));
        }
      }

      function setDecision(hunkId, decision) {
        if (submitted) return;
        decisions.set(hunkId, decision);
        const container = document.querySelector(`[data-hunk-id="${CSS.escape(hunkId)}"] .decision`);
        if (container) updateDecisionButtons(container, decision);
        updateCounts();
      }

      function setAll(decision) {
        for (const hunk of reviewData?.hunks || []) {
          decisions.set(hunk.hunk_id, decision);
        }
        for (const item of document.querySelectorAll(".hunk")) {
          updateDecisionButtons(item.querySelector(".decision"), decision);
        }
        updateCounts();
      }

      function createHunk(hunk, index, total) {
        const article = document.createElement("article");
        article.className = "hunk";
        article.dataset.hunkId = hunk.hunk_id;

        const header = document.createElement("div");
        header.className = "hunk-header";
        const title = document.createElement("div");
        title.className = "hunk-title";
        const name = document.createElement("h2");
        name.className = "hunk-name";
        name.textContent = `${index + 1}/${total}  ${hunk.target_path}`;
        const id = document.createElement("div");
        id.className = "hunk-id";
        id.textContent = hunk.hunk_id;
        title.append(name, id);

        const decision = document.createElement("div");
        decision.className = "decision";
        decision.setAttribute("role", "group");
        decision.setAttribute("aria-label", `Decision for ${hunk.target_path}`);
        for (const [value, label] of [["accept", "Accept"], ["reject", "Reject"]]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = value;
          button.dataset.decision = value;
          button.textContent = label;
          button.setAttribute("aria-pressed", String(value === "accept"));
          button.addEventListener("click", () => setDecision(hunk.hunk_id, value));
          decision.appendChild(button);
        }
        header.append(title, decision);

        const diff = document.createElement("pre");
        diff.className = "diff";
        diff.setAttribute("aria-label", `${hunk.target_path} unified diff`);
        renderDiff(diff, hunk.diff);
        article.append(header, diff);
        return article;
      }

      function render(payload) {
        const next = payload?.review_app;
        if (!next || !Array.isArray(next.hunks)) {
          applyAuthoritativeState(payload);
          return;
        }
        reviewData = next;
        decisions.clear();
        hunksEl.replaceChildren();
        submitted = false;

        for (const hunk of next.hunks) decisions.set(hunk.hunk_id, "accept");
        next.hunks.forEach((hunk, index) => {
          hunksEl.appendChild(createHunk(hunk, index, next.hunks.length));
        });

        summaryEl.textContent = `${next.hunks.length} hunks · proposal ${next.proposal_id}`;
        updateCounts();
        if (initialized) {
          setStatus("All hunks are accepted by default; adjust each choice before submitting.", "neutral");
        } else {
          setDisabled(true);
          setStatus("Syncing the latest review state...", "neutral");
        }
        loadingEl.hidden = true;
        reviewEl.hidden = false;
        notifySize();
        if (initialized) void refreshAuthoritativeState();
      }

      function setDisabled(value) {
        for (const button of document.querySelectorAll("button")) button.disabled = value;
      }

      function selectionKey(acceptedIds) {
        const bits = reviewData.hunks
          .map((hunk) => acceptedIds.includes(hunk.hunk_id) ? "a" : "r")
          .join("");
        return `mcp-app:${reviewData.proposal_id}:${bits}`;
      }

      function selectionMode(acceptedIds) {
        if (acceptedIds.length === 0) return "none";
        if (acceptedIds.length === reviewData.hunks.length) return "all";
        return "explicit";
      }

      function resultError(result, fallback) {
        if (!result?.isError) return null;
        const text = result.content?.find((item) => item.type === "text")?.text;
        return new Error(text || fallback);
      }

      function applyAuthoritativeState(payload) {
        const state = payload?.session?.state;
        if (!state) return;
        loadingEl.hidden = true;
        reviewEl.hidden = false;
        if (state === "awaiting_review") {
          submitted = false;
          setDisabled(false);
          setStatus("All hunks are accepted by default; adjust each choice before submitting.", "neutral");
          return;
        }

        submitted = true;
        setDisabled(true);
        const labels = {
          validating: "Choices submitted; waiting for the current task to continue validation.",
          ready: "Choices submitted; validation for this iteration is complete.",
          completed: "Choices submitted; optimization is complete."
        };
        setStatus(labels[state] || `Choices submitted. Current state: ${state}.`, "success");
      }

      async function refreshAuthoritativeState() {
        if (!reviewData || !initialized || refreshPromise) return refreshPromise;
        const statusTool = reviewData.status_tool;
        if (!statusTool) return null;
        setDisabled(true);
        setStatus("Syncing the latest review state...", "neutral");
        refreshPromise = (async () => {
          try {
            const result = await callTool(statusTool, {
              output_dir: reviewData.output_dir,
              compact: true
            });
            const error = resultError(result, "State sync failed");
            if (error) throw error;
            applyAuthoritativeState(result?.structuredContent);
            return result;
          } catch (error) {
            submitted = false;
            setDisabled(false);
            setStatus(error?.message || "State sync failed. Please try again.", "error");
            return null;
          } finally {
            refreshPromise = null;
            notifySize();
          }
        })();
        return refreshPromise;
      }

      async function submitSelection() {
        if (!reviewData || submitted) return;
        const acceptedIds = reviewData.hunks
          .filter((hunk) => decisions.get(hunk.hunk_id) === "accept")
          .map((hunk) => hunk.hunk_id);
        const rejectedIds = reviewData.hunks
          .filter((hunk) => decisions.get(hunk.hunk_id) === "reject")
          .map((hunk) => hunk.hunk_id);
        const mode = selectionMode(acceptedIds);

        setDisabled(true);
        setStatus("Submitting choices...", "neutral");
        try {
          const submitArguments = {
            output_dir: reviewData.output_dir,
            selection_mode: mode,
            idempotency_key: selectionKey(acceptedIds),
            actor: "user",
            reason: "selected through SkillAdam MCP App review"
          };
          if (mode === "explicit") submitArguments.accepted_hunk_ids = acceptedIds;
          const result = await callTool(reviewData.submit_tool, submitArguments);
          const error = resultError(result, "Submission failed");
          if (error) throw error;
          submitted = true;
          applyAuthoritativeState(result?.structuredContent);
          await updateModelContext(acceptedIds, rejectedIds);
          setStatus(
            "Choices submitted. Send 'continue' in the current task to resume validation.",
            "success"
          );
        } catch (error) {
          setDisabled(false);
          setStatus(error?.message || "Submission failed", "error");
        }
        notifySize();
      }

      async function updateModelContext(acceptedIds, rejectedIds) {
        try {
          await request("ui/update-model-context", {
            content: [{
              type: "text",
              text: `SkillAdam review submitted for proposal ${reviewData.proposal_id}.`
            }],
            structuredContent: {
              proposal_id: reviewData.proposal_id,
              accepted_hunk_ids: acceptedIds,
              rejected_hunk_ids: rejectedIds,
              output_dir: reviewData.output_dir,
              next_tool: reviewData.continue_tool,
              next_action: "await_user_continue"
            }
          }, 5000);
        } catch (_) {}
      }

      function notifySize() {
        const shell = document.querySelector(".shell");
        const height = Math.ceil((shell?.getBoundingClientRect().height || 0) + 28);
        notify("ui/notifications/size-changed", { height });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.id !== undefined && pending.has(message.id)) {
          const waiter = pending.get(message.id);
          pending.delete(message.id);
          window.clearTimeout(waiter.timer);
          if (message.error) waiter.reject(new Error(message.error.message || "Host request failed"));
          else waiter.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") render(message.params?.structuredContent);
        if (message.method === "ui/notifications/host-context-changed") {
          applyHostContext(message.params);
          notifySize();
        }
      }, { passive: true });

      acceptAllButton.addEventListener("click", () => setAll("accept"));
      rejectAllButton.addEventListener("click", () => setAll("reject"));
      submitButton.addEventListener("click", submitSelection);
      window.addEventListener("resize", notifySize, { passive: true });

      request("ui/initialize", {
        protocolVersion: PROTOCOL_VERSION,
        appInfo: APP_INFO,
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] }
      }).then((result) => {
        initialized = true;
        applyHostContext(result?.hostContext);
        notify("ui/notifications/initialized", {});
        void refreshAuthoritativeState();
      }).catch(() => {
        initialized = true;
        const fallback = window.openai?.toolOutput;
        if (fallback) render(fallback);
        void refreshAuthoritativeState();
      });

      if (window.openai?.toolOutput) render(window.openai.toolOutput);
    })();
  </script>
</body>
</html>
